name: Build FilmCraft Android Tablet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a2416f5717b522045f8b702e26a" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Download Latest Official FilmCraft Web Build
        run: |
          mkdir -p app/src/main/assets/www
          WEB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/storytold/filmcraft/releases | jq -r '[.[].assets[] | select(.name | test("^filmcraft-web-.*\\.zip$"))][0].browser_download_url')
          if [ -z "$WEB_URL" ] || [ "$WEB_URL" = "null" ]; then
            WEB_URL="https://github.com/storytold/filmcraft/releases/download/v0.8.0/filmcraft-web-0.8.0.zip"
          fi
          echo "Downloading FilmCraft Web release from: $WEB_URL"
          curl -fL "$WEB_URL" -o filmcraft-web.zip
          mkdir -p tmp_web
          unzip -q filmcraft-web.zip -d tmp_web
          if compgen -G "tmp_web/filmcraft-web-*/*" > /dev/null; then
            cp -r tmp_web/filmcraft-web-*/* app/src/main/assets/www/
          else
            cp -r tmp_web/* app/src/main/assets/www/
          fi

      - name: Inject Android Blob Download Bridge into index.html
        run: |
          cat << 'BRIDGE_EOF' > bridge.js
          <script>
          (function() {
            const origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function() {
              if (this.download && this.href && this.href.startsWith('blob:') && window.AndroidBridge) {
                const fileName = this.download || 'filmcraft-export.mp4';
                fetch(this.href)
                  .then(r => r.blob())
                  .then(blob => {
                    const reader = new FileReader();
                    reader.onloadend = function() {
                      const base64data = reader.result.split(',')[1];
                      window.AndroidBridge.saveBlob(base64data, fileName, blob.type || 'video/mp4');
                    };
                    reader.readAsDataURL(blob);
                  });
                return;
              }
              return origClick.apply(this, arguments);
            };
          })();
          </script>
          BRIDGE_EOF
          python3 -c '
          import pathlib
          idx = pathlib.Path("app/src/main/assets/www/index.html")
          html = idx.read_text(encoding="utf-8")
          bridge = pathlib.Path("bridge.js").read_text(encoding="utf-8")
          if "</head>" in html:
              html = html.replace("</head>", bridge + "\n</head>", 1)
          else:
              html = bridge + "\n" + html
          idx.write_text(html, encoding="utf-8")
          '

      - name: Generate Android Wrapper Project Files
        run: |
          mkdir -p app/src/main/java/ai/storyteller/filmcraft

          cat << 'SETTINGS_EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FilmCraftTablet"
          include ':app'
          SETTINGS_EOF

          cat << 'PROP_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROP_EOF

          cat << 'ROOT_GRADLE_EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ROOT_GRADLE_EOF

          cat << 'APP_GRADLE_EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ai.storyteller.filmcraft'
              compileSdk 34

              defaultConfig {
                  applicationId "ai.storyteller.filmcraft"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "0.8.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              aaptOptions {
                  noCompress "wasm", "fcproj", "icc", "ttf", "otf"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          APP_GRADLE_EOF

          cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:label="FilmCraft"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:exported="true"
                      android:screenOrientation="fullSensor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          cat << 'JAVA_EOF' > app/src/main/java/ai/storyteller/filmcraft/MainActivity.java
          package ai.storyteller.filmcraft;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  hideSystemUI();

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);

                  webView.addJavascriptInterface(new BlobSaveBridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse resp = assetLoader.shouldInterceptRequest(request.getUrl());
                          if (resp != null && request.getUrl().getPath() != null && request.getUrl().getPath().endsWith(".wasm")) {
                              resp.setMimeType("application/wasm");
                          }
                          return resp;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          startActivityForResult(Intent.createChooser(intent, "Open in FilmCraft"), FILE_CHOOSER_RESULT_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              public class BlobSaveBridge {
                  @JavascriptInterface
                  public void saveBlob(String base64Data, String fileName, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                      if (out != null) out.write(bytes);
                                  }
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File outFile = new File(dir, fileName);
                              try (FileOutputStream out = new FileOutputStream(outFile)) {
                                  out.write(bytes);
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads: " + fileName, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Save failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA_EOF

      - name: Build Signed APK with Gradle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FilmCraft-Tablet.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-Android-Tablet-APK
          path: FilmCraft-Tablet.apk
