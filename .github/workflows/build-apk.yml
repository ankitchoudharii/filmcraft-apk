          cat << 'JAVA_EOF' > app/src/main/java/ai/storyteller/filmcraft/MainActivity.java
          package ai.storyteller.filmcraft;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  hideSystemUI();

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);

                  webView.addJavascriptInterface(new BlobSaveBridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse resp = assetLoader.shouldInterceptRequest(request.getUrl());
                          if (resp != null && request.getUrl().getPath() != null && request.getUrl().getPath().endsWith(".wasm")) {
                              resp.setMimeType("application/wasm");
                          }
                          return resp;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          startActivityForResult(Intent.createChooser(intent, "Open in FilmCraft"), FILE_CHOOSER_RESULT_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              public class BlobSaveBridge {
                  @JavascriptInterface
                  public void saveBlob(String base64Data, String fileName, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                      if (out != null) out.write(bytes);
                                  }
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File outFile = new File(dir, fileName);
                              try (FileOutputStream out = new FileOutputStream(outFile)) {
                                  out.write(bytes);
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads: " + fileName, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Save failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
