storytold/photocraft does not currently publish an official Android .apk in its GitHub Releases or on the ArtCraft PhotoCraft download page (which ship builds for macOS, Windows, Linux x86_64/aarch64/riscv64, FreeBSD, and a self-hosted WebAssembly zip), and I cannot compile an Android binary directly in this environment. However, because PhotoCraft's workspace architecture is 100% pure Rust built on egui/eframe and wgpu (Cargo.toml) with both a WebAssembly frontend and precompiled ARM64 Linux binaries, you have three practical ways to get it running on an Android tablet.

Comparison of Android Tablet Options
Approach	How It Works	Stylus & Tablet Support	Effort
1. WebAssembly APK Wrapper (photocraft-web)	Wraps the official photocraft-web-<version>.zip from GitHub Releases into an offline Android WebView/Capacitor .apk (or installs it as a PWA)	Supports stylus pressure and tilt out of the box via browser Pointer Events (PhotoCraft Web Guide, Roadmap)	Low (no Rust code changes; can build .apk via GitHub Actions)
2. Official ARM64 Linux Build (Termux:X11)	Runs the official photocraft-0.9.0-linux-aarch64.tar.gz or .deb from GitHub Releases inside Termux (proot-distro + Termux:X11 APK)	Supports stylus pressure via PhotoCraft's X11 XInput2 path in crates/tablet (AGENTS.md)	Low (uses upstream ARM64 binary directly on the tablet)
3. Native Rust Android Port (cargo-apk)	Adds an android-activity / eframe cdylib crate to a fork of storytold/photocraft and compiles for aarch64-linux-android	Requires custom JNI/NDK wiring for stylus pressure (crates/tablet only targets macOS AppKit and Linux X11) and Android Storage Access Framework	High (requires Rust 1.95+, Android NDK, and custom file/pen bridges)
1. Recommended APK Route: Package photocraft-web into an Offline Android .apk
Because PhotoCraft compiles its entire engine and egui interface to WebAssembly (apps/photocraft-web, ~10.6 MB zipped in PhotoCraft Web Guide), packaging the official web release into a standalone Android .apk gives you the most complete tablet experience right now:

Retain full stylus pressure and tilt: According to the PhotoCraft Roadmap, the web build already reads stylus pressure, tilt, and twist through standard Pointer Events, whereas the native photocraft-tablet crate only supports macOS (AppKit) and Linux X11 (XInput2). Active upstream patches such as PR #6910 also specifically fix touch menu taps on the web target.

Serve assets from a secure local origin: As detailed in the PhotoCraft Web Guide, PhotoCraft's wgpu renderer requires a secure context (https:// or http://localhost) to enable WebGPU and clipboard access (otherwise falling back to WebGL2 via ?webgl or CPU via ?cpu). Using Capacitor (androidScheme: 'https') or Android's WebViewAssetLoader serves the unzipped index.html, .js, and .wasm files locally over https:// completely offline with full hardware acceleration.

Enable landscape fullscreen and file downloads: Configure screenOrientation="sensorLandscape" in AndroidManifest.xml and attach a DownloadListener / WebChromeClient.onShowFileChooser so File › Open, Save, and Export As use Android's native file picker.

2. Native Rust APK Route: What Needs to Change in the Codebase
If you want to compile a native .apk from source rather than wrapping the WebAssembly build, Cargo.toml and AGENTS.md show the specific constraints you will need to handle in a fork:

Create a dedicated apps/photocraft-android crate: The existing desktop shell (apps/photocraft) is a binary crate (main.rs) that initializes a loopback TCP control server (PyShine Architecture Overview), desktop printing (craft-print), and photocraft-tablet. You need a new cdylib crate exporting android_main(app: AndroidApp) via eframe (egui = "0.36", eframe = "0.36", which uses winit 0.30).

Override the workspace unsafe_code = "forbid" lint for the entry point: Because Cargo.toml enforces unsafe_code = "forbid" workspace-wide (with crates/tablet as the only exception noted in AGENTS.md), the android_main FFI export requires allowing unsafe_code in the new Android shell crate.

Replace desktop-only dependencies (rfd and craft-print): The workspace uses rfd = "0.17" for desktop file dialogs and craft-print from storytold/craft-libs for system printing (Cargo.toml). On target_os = "android", you must gate off craft-print and route file open/save commands to Android's Storage Access Framework or app-scoped storage instead of desktop rfd.

